<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ćwiczenia z lukami</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--purple:#7758e8;--pink:#ff6b9d;--green:#20b486;--bg:#f6f4ff;--card:#fff;--ink:#302d4a;--mut:#8b86a4;--line:#ebe7fb;--soft:#f4f0ff;--ok-bg:#e5fff5;--ok:#087c5a;--bad-bg:#fff0f4;--bad:#ce4264;--field:#faf9ff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#17152a;--card:#221f3a;--ink:#ece9ff;--mut:#9d98bd;--line:#35315a;--soft:#2c2850;--ok-bg:#12382e;--ok:#5fe0b6;--bad-bg:#402032;--bad:#ff8fa8;--field:#1c1932}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;padding:24px 14px;font-family:'Poppins',system-ui,sans-serif;color:var(--ink);background:var(--bg);min-height:100vh}
.wrap{max-width:1000px;margin:auto}
.hero{text-align:center;padding:24px 18px;border-radius:26px;color:#fff;background:linear-gradient(120deg,#7857e8,#b06af4,#ff78ad)}
.hero h1{margin:4px 0;font-size:clamp(22px,5vw,34px);font-weight:800}.hero p{margin:6px 0 0;opacity:.95;font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;margin-top:18px}
h2{font-size:18px;margin:0 0 12px}h3{font-size:14px;margin:14px 0 6px}
.grid{display:grid;grid-template-columns:230px 1fr;gap:16px;margin-top:18px}
@media(max-width:720px){.grid{grid-template-columns:1fr}}
.side .card,.main .card{margin-top:0}
.item{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 12px;border-radius:12px;cursor:pointer;font-size:14px;font-weight:600;border:2px solid transparent}
.item:hover{background:var(--soft)}.item.on{background:var(--soft);border-color:var(--purple);color:var(--purple)}
.item small{color:var(--mut);font-weight:500}
input[type=text],textarea{width:100%;padding:10px 12px;border:2px solid var(--line);border-radius:12px;background:var(--field);color:var(--ink);font:500 14px 'Poppins',sans-serif;outline:none}
input:focus,textarea:focus{border-color:var(--purple)}
textarea{min-height:200px;resize:vertical;line-height:1.7}
label{font-size:12px;font-weight:700;color:var(--mut);display:block;margin:12px 0 5px}
.btn{border:none;border-radius:12px;padding:10px 16px;font:700 13px 'Poppins',sans-serif;cursor:pointer;background:var(--soft);color:var(--purple)}
.btn:hover{transform:translateY(-1px)}
.btn.p{color:#fff;background:linear-gradient(100deg,#7858e8,#a16aef)}.btn.g{color:#fff;background:linear-gradient(100deg,#20b486,#3fd0a2)}.btn.d{color:var(--bad);background:var(--bad-bg)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px}
.chip{display:inline-flex;gap:6px;align-items:center;padding:6px 10px;border-radius:10px;background:var(--soft);font-size:12px;font-weight:600;margin:3px}
.gaprow{display:flex;gap:8px;align-items:center;margin:6px 0}.gaprow b{min-width:58px;font-size:12px;color:var(--purple)}
.hint{font-size:12px;color:var(--mut);margin-top:8px;line-height:1.6}
.tabs{display:flex;gap:6px;margin-bottom:14px}.tab{padding:8px 14px;border-radius:12px;font-weight:700;font-size:13px;cursor:pointer;background:var(--soft);color:var(--purple)}.tab.on{background:var(--purple);color:#fff}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line)}th{color:var(--mut);font-size:12px}
.sc{font-weight:800}.sc.hi{color:var(--ok)}.sc.lo{color:var(--bad)}
.tablewrap{overflow-x:auto}
.story{font-size:15px;line-height:2.7}
.blank{width:140px;max-width:100%;padding:6px 9px;margin:3px;border:2px solid var(--line);border-radius:10px;background:var(--field);color:var(--purple);font:600 14px 'Poppins',sans-serif;outline:none;display:inline-block}
.blank:focus{border-color:var(--purple)}.blank.correct{border-color:var(--green);background:var(--ok-bg);color:var(--ok)}.blank.wrong{border-color:#ff7190;background:var(--bad-bg);color:var(--bad)}
.bank{display:flex;flex-wrap:wrap;gap:9px}.word{border:2px solid var(--line);background:var(--soft);color:var(--purple);border-radius:12px;padding:8px 12px;font:700 13px 'Poppins',sans-serif;cursor:pointer}.word.used{opacity:.35;text-decoration:line-through}
.inst{padding:12px 14px;border-radius:14px;background:var(--soft);font-weight:600;font-size:14px;line-height:1.6;margin-bottom:14px}
.bar{background:var(--line);height:9px;border-radius:99px;margin-top:16px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#7758e8,#ff75ae);transition:width .3s}
.res{display:none;margin-top:16px;padding:16px;border-radius:14px;background:var(--soft);font-weight:600;line-height:1.8}
.code{width:100%;font-size:11px;min-height:60px;margin-top:6px}
.msg{font-size:12px;font-weight:600;color:var(--green);margin-left:6px}
.empty{color:var(--mut);font-size:13px;padding:10px 0}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
(function(){
const $=s=>document.querySelector(s);
const app=$("#app");
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const enc=o=>btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
const dec=s=>{s=s.replace(/-/g,"+").replace(/_/g,"/");while(s.length%4)s+="=";return JSON.parse(decodeURIComponent(escape(atob(s))))};
const norm=t=>t.trim().toLowerCase().replace(/[’‘`]/g,"'").replace(/\s+/g," ");
const GAP=/\[\[(.+?)\]\]/g;
const fmt=d=>new Date(d).toLocaleString("pl-PL",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"});
const shrink=(f,max,q)=>new Promise((ok,no)=>{const fr=new FileReader();fr.onerror=no;fr.onload=()=>{const im=new Image();im.onerror=no;im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);ok({blob:()=>new Promise(r=>c.toBlob(r,'image/jpeg',q)),url:()=>c.toDataURL('image/jpeg',q)})};im.src=fr.result};fr.readAsDataURL(f)});
const hdr=(t,p)=>`<header class="hero"><div style="font-size:38px">📚✨</div><h1>${t}</h1><p>${p}</p></header>`;

/* ---------- STUDENT ---------- */
function student(ex){
  const bankWords=[];
  const parts=[];let last=0,n=0;
  ex.x.replace(GAP,(m,a,i)=>{parts.push(esc(ex.x.slice(last,i)).replace(/\n/g,"<br>"));
    const ans=a.split("|").map(s=>s.trim()).filter(Boolean);bankWords.push(ans[0]);
    parts.push(`<input class="blank" data-a="${esc(ans.join("|"))}" aria-label="Luka ${++n}" autocomplete="off" autocapitalize="off" spellcheck="false">`);last=i+m.length;return m});
  parts.push(esc(ex.x.slice(last)).replace(/\n/g,"<br>"));
  const words=ex.b?[...bankWords,...(ex.e||"").split(",").map(s=>s.trim()).filter(Boolean)].sort(()=>Math.random()-.5):[];
  app.innerHTML=hdr(esc(ex.t||"Ćwiczenie"),"Uzupełnij luki i kliknij „Sprawdź”. Masz tylko jedną próbę!")+
  (words.length?`<section class="card"><h2>🎨 Bank słów</h2><div class="bank" id="bank"></div><div class="hint">Kliknij słowo, a potem lukę, albo wpisz odpowiedź ręcznie.</div></section>`:"")+
  `<section class="card">${ex.n?`<div class="inst">${esc(ex.n)}</div>`:""}${(ex.im||[]).map(u=>`<img src="${esc(u)}" alt="" style="max-width:100%;border-radius:14px;margin:0 0 14px;display:block">`).join("")}
  <label style="margin-top:0">Twoje imię i nazwisko</label><input type="text" id="sname" placeholder="np. Anna Kowalska" style="max-width:320px;margin-bottom:14px">
  <div class="story">${parts.join("")}</div><div class="bar"><i id="bar"></i></div>
  <div class="row"><button class="btn p" id="chk">✅ Sprawdź (tylko raz)</button></div>
  <div class="res" id="res"></div></section>`;
  const blanks=[...document.querySelectorAll(".blank")];let sel=null,lastIn=null;let saved=null;if(!ex.p){try{saved=JSON.parse(localStorage.getItem("luki_done_"+ex.i))}catch(e){}}
  const bank=$("#bank");
  const upd=()=>{const u=new Set(blanks.map(b=>norm(b.value)));document.querySelectorAll(".word").forEach(w=>w.classList.toggle("used",u.has(norm(w.textContent))))};
  words.forEach(w=>{const b=document.createElement("button");b.className="word";b.type="button";b.textContent=w;
    b.onclick=()=>{const t=document.activeElement.classList&&document.activeElement.classList.contains("blank")?document.activeElement:(lastIn&&!lastIn.value?lastIn:blanks.find(x=>!x.value));
      if(t){t.value=w;t.classList.remove("correct","wrong");t.focus();upd()}};bank.appendChild(b)});
  blanks.forEach(b=>{b.addEventListener("focus",()=>lastIn=b);b.addEventListener("input",()=>{b.classList.remove("correct","wrong");upd()});
    b.addEventListener("click",()=>{if(sel&&!b.value){}})});
  $("#chk").onclick=()=>{
    const name=$("#sname").value.trim();
    if(!name){$("#sname").focus();$("#sname").style.borderColor="#ff7190";return}
    if(!saved&&!ex.p&&!confirm("Możesz sprawdzić odpowiedzi tylko jeden raz. Czy na pewno chcesz sprawdzić?"))return;
    let ok=0;blanks.forEach(b=>{const good=b.dataset.a.split("|").map(norm).includes(norm(b.value));b.classList.remove("correct","wrong");b.classList.add(good?"correct":"wrong");if(good)ok++});
    const t=blanks.length;$("#bar").style.width=(t?ok/t*100:0)+"%";
    const code=saved?saved.code:enc({i:ex.i,n:name,c:ok,t:t,d:new Date().toISOString()});
    if(!ex.p){blanks.forEach(b=>b.readOnly=true);document.querySelectorAll(".word").forEach(w=>w.disabled=true);$("#sname").readOnly=true;$("#chk").style.display="none";
      try{localStorage.setItem("luki_done_"+ex.i,JSON.stringify({code:code,ans:blanks.map(b=>b.value),name:name}))}catch(e){}}
    const r=$("#res");r.style.display="block";
    r.innerHTML=`${ok===t?"🏆 Perfekcyjnie!":"⭐ Twój wynik:"} <span style="color:var(--ok)">✔ ${ok} dobrze</span> · <span style="color:var(--bad)">✘ ${t-ok} źle</span> (${ok}/${t})
    <div class="hint">Zielone luki są poprawne, czerwone błędne. To była jedyna próba. Skopiuj kod wyniku i wyślij go nauczycielowi:</div>
    <textarea class="code" readonly onclick="this.select()">${code}</textarea>
    <div class="row"><button class="btn g" id="cp">📋 Kopiuj kod wyniku</button><span class="msg" id="cm"></span></div>`;
    $("#cp").onclick=()=>{const ta=r.querySelector("textarea");ta.select();try{navigator.clipboard.writeText(ta.value)}catch(e){document.execCommand("copy")}$("#cm").textContent="Skopiowano!"};
  };
  if(saved){$("#sname").value=saved.name;blanks.forEach((b,i)=>b.value=saved.ans[i]||"");upd();$("#chk").onclick()}
}

/* ---------- TEACHER ---------- */
let S={folders:[],ex:[],res:[]},curF="all",curE=null,tab="edit",dbDoc=null,note="";
async function load(){
  try{const u=await claude.use("db");if(u)dbDoc=u.doc("app/state")}catch(e){}
  try{if(dbDoc){const s=await dbDoc.get();if(s.exists){S=Object.assign(S,s.data());return}}}catch(e){}
  try{const l=localStorage.getItem("luki_state");if(l)S=Object.assign(S,JSON.parse(l))}catch(e){}
}
let tmr;function save(){clearTimeout(tmr);tmr=setTimeout(async()=>{
  try{if(dbDoc)await dbDoc.set(JSON.parse(JSON.stringify(S)))}catch(e){}
  try{localStorage.setItem("luki_state",JSON.stringify(S))}catch(e){}},400)}
function link(e){return location.href.split("#")[0]+"#u="+enc({i:e.id,t:e.title,n:e.inst,x:e.text,b:e.bank,e:e.extra,im:e.images||[]})}
function gaps(text){const a=[];text.replace(GAP,(m,x)=>{a.push(x);return m});return a}

function teacher(){
  const fl=S.ex.filter(e=>curF==="all"||e.folder===curF);
  const e=S.ex.find(x=>x.id===curE);
  app.innerHTML=hdr("Panel nauczyciela","Twórz ćwiczenia z lukami, generuj linki i sprawdzaj wyniki")+`
  <div class="grid"><div class="side"><div class="card"><h2>📁 Foldery</h2>
    <div class="item ${curF==="all"?"on":""}" data-f="all">Wszystkie <small>${S.ex.length}</small></div>
    ${S.folders.map(f=>`<div class="item ${curF===f.id?"on":""}" data-f="${f.id}">${esc(f.name)} <small>${S.ex.filter(x=>x.folder===f.id).length}</small></div>`).join("")}
    <div class="row"><button class="btn" id="addF">+ Nowy folder</button>${curF!=="all"?`<button class="btn d" id="delF">Usuń</button>`:""}</div>
    <h2 style="margin-top:18px">📝 Teksty</h2>
    ${fl.map(x=>`<div class="item ${curE===x.id?"on":""}" data-e="${x.id}">${esc(x.title||"Bez tytułu")}</div>`).join("")||'<div class="empty">Brak tekstów</div>'}
    <div class="row"><button class="btn p" id="addE">+ Dodaj tekst</button></div></div></div>
  <div class="main">${e?editor(e):`<div class="card"><div class="empty">Wybierz tekst z listy lub kliknij „Dodaj tekst”.</div></div>`}</div></div>`;
  document.querySelectorAll("[data-f]").forEach(el=>el.onclick=()=>{curF=el.dataset.f;teacher()});
  document.querySelectorAll("[data-e]").forEach(el=>el.onclick=()=>{curE=el.dataset.e;tab="edit";note="";teacher()});
  $("#addF").onclick=()=>{const n=prompt("Nazwa folderu (np. uczeń lub kategoria):");if(n&&n.trim()){const f={id:uid(),name:n.trim()};S.folders.push(f);curF=f.id;save();teacher()}};
  const df=$("#delF");if(df)df.onclick=()=>{if(confirm("Usunąć folder? Teksty zostaną przeniesione do „Wszystkie”.")){S.ex.forEach(x=>{if(x.folder===curF)x.folder=""});S.folders=S.folders.filter(f=>f.id!==curF);curF="all";save();teacher()}};
  $("#addE").onclick=()=>{const x={id:uid(),folder:curF==="all"?"":curF,title:"Nowe ćwiczenie",inst:"Uzupełnij luki poprawną formą czasownika.",text:"",bank:true,extra:"",created:new Date().toISOString()};S.ex.unshift(x);curE=x.id;tab="edit";save();teacher()};
  if(e)bindEditor(e);
}
function editor(e){
  const g=gaps(e.text);
  const rs=S.res.filter(r=>r.ex===e.id).sort((a,b)=>b.d.localeCompare(a.d));
  const att={},cn={};[...rs].reverse().forEach(r=>{const k=r.n.trim().toLowerCase();att[r.id]=cn[k]=(cn[k]||0)+1});
  return `<div class="card"><div class="tabs"><div class="tab ${tab==="edit"?"on":""}" data-t="edit">✏️ Edycja</div><div class="tab ${tab==="res"?"on":""}" data-t="res">📊 Wyniki (${rs.length})</div></div>`+
  (tab==="edit"?`
  <label style="margin-top:0">Tytuł</label><input type="text" id="t" value="${esc(e.title)}">
  <label>Polecenie dla ucznia</label><input type="text" id="n" value="${esc(e.inst)}">
  <label>Folder</label><select id="fo" style="padding:9px;border-radius:12px;border:2px solid var(--line);background:var(--field);color:var(--ink);font:500 14px Poppins">
   <option value="">— brak —</option>${S.folders.map(f=>`<option value="${f.id}" ${e.folder===f.id?"selected":""}>${esc(f.name)}</option>`).join("")}</select>
  <label>Zdjęcia (opcjonalnie, pokażą się nad tekstem)</label>
  <div>${(e.images||[]).map((u,i)=>`<span class="chip"><img src="${esc(u)}" alt="" style="height:56px;border-radius:8px"><button class="btn d" data-di="${i}">✕</button></span>`).join("")}</div>
  <div class="row"><button class="btn" id="ai">🖼 Dodaj zdjęcie</button><input type="file" id="fi" accept="image/*" hidden><span class="msg" id="im"></span></div>
  <label>Tekst. Wpisz lub wklej, potem zaznacz słowo i kliknij „Zrób lukę”</label><textarea id="x" placeholder="Wklej tutaj tekst...">${esc(e.text)}</textarea>
  <div class="row"><button class="btn p" id="mk">✂️ Zrób lukę z zaznaczenia</button><button class="btn" id="un">↩ Cofnij ostatnią lukę</button></div>
  <div class="hint">Luka jest zapisana jako <b>[[słowo]]</b>. Możesz też wpisać ją ręcznie, np. <b>[[didn't steal|did not steal]]</b> (kilka poprawnych odpowiedzi rozdziela znak |).</div>
  <h3>Poprawne odpowiedzi (${g.length} luk)</h3>
  ${g.map((a,i)=>`<div class="gaprow"><b>Luka ${i+1}</b><input type="text" data-g="${i}" value="${esc(a.split("|").map(s=>s.trim()).join(" | "))}"></div>`).join("")||'<div class="empty">Brak luk. Zaznacz słowo w tekście.</div>'}
  ${g.length?`<div class="hint">Wpisz kilka poprawnych odpowiedzi oddzielając je znakiem | (pierwsza trafi do banku słów).</div>`:""}
  <label><input type="checkbox" id="bk" ${e.bank?"checked":""}> Pokaż bank słów (odpowiedzi z luk + dodatkowe)</label>
  <input type="text" id="ex" placeholder="Dodatkowe słowa-rozpraszacze, po przecinku" value="${esc(e.extra||"")}">
  <div class="row"><button class="btn g" id="gen">🔗 Generuj link</button><button class="btn" id="pv">👁 Podgląd</button><button class="btn d" id="del">Usuń tekst</button></div>
  <div id="lk"></div>`:`
  <div class="tablewrap">${rs.length?`<table><tr><th>Uczeń</th><th>Dobrze</th><th>Źle</th><th>Wynik</th><th>Data</th><th></th></tr>
  ${rs.map(r=>{const p=Math.round(r.c/r.t*100);return `<tr><td><b>${esc(r.n)}</b>${att[r.id]>1?` <span style="color:var(--bad);font-size:11px">⚠ próba ${att[r.id]}</span>`:""}</td><td style="color:var(--ok)">${r.c}</td><td style="color:var(--bad)">${r.t-r.c}</td><td class="sc ${p>=60?"hi":"lo"}">${p}%</td><td>${fmt(r.d)}</td><td><button class="btn d" data-r="${r.id}">✕</button></td></tr>`}).join("")}</table>`:'<div class="empty">Brak wyników. Wklej kod wyniku od ucznia poniżej.</div>'}</div>
  <h3>Dodaj wynik ucznia</h3><textarea class="code" id="rc" placeholder="Wklej tutaj kod wyniku przesłany przez ucznia"></textarea>
  <div class="row"><button class="btn p" id="ar">➕ Dodaj wynik</button><span class="msg" id="rm">${esc(note)}</span></div>
  <div class="hint">Uczeń po sprawdzeniu dostaje kod wyniku, który wysyła Ci (np. na komunikatorze lub mailem). Data i liczba dobrych/złych odpowiedzi są w kodzie.</div>`)+`</div>`;
}
function bindEditor(e){
  document.querySelectorAll("[data-t]").forEach(el=>el.onclick=()=>{tab=el.dataset.t;teacher()});
  if(tab==="res"){
    document.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{S.res=S.res.filter(r=>r.id!==b.dataset.r);save();teacher()});
    $("#ar").onclick=()=>{try{const o=dec($("#rc").value.trim());if(o.i!==e.id){note="Ten kod jest z innego ćwiczenia.";teacher();return}
      S.res.push({id:uid(),ex:o.i,n:o.n,c:o.c,t:o.t,d:o.d});note="Dodano!";save();teacher()}catch(x){note="Nieprawidłowy kod.";$("#rm").textContent=note;$("#rm").style.color="var(--bad)"}};
    return}
  const t=$("#t"),n=$("#n"),x=$("#x");
  t.oninput=()=>{e.title=t.value;save()};n.oninput=()=>{e.inst=n.value;save()};
  $("#fo").onchange=ev=>{e.folder=ev.target.value;save();teacher()};
  $("#bk").onchange=ev=>{e.bank=ev.target.checked;save()};$("#ex").oninput=ev=>{e.extra=ev.target.value;save()};
  $("#ai").onclick=()=>$("#fi").click();
  $("#fi").onchange=async ev=>{const f=ev.target.files[0];if(!f)return;const m=$("#im");m.textContent="Wgrywanie...";
    try{const as=await claude.use("assets");let url;const s=await shrink(f,as?1200:500,as?.85:.6);
      if(as){const r=await as.upload(await s.blob());url=r.url}else url=s.url();
      (e.images=e.images||[]).push(url);save();teacher()}catch(z){m.textContent="Nie udało się wgrać zdjęcia.";m.style.color="var(--bad)"}};
  document.querySelectorAll("[data-di]").forEach(b=>b.onclick=()=>{e.images.splice(+b.dataset.di,1);save();teacher()});
  x.oninput=()=>{e.text=x.value;save()};
  x.onchange=()=>teacher();
  $("#mk").onclick=()=>{const s=x.selectionStart,en=x.selectionEnd;const sel=x.value.slice(s,en);
    if(!sel.trim()){alert("Najpierw zaznacz słowo lub fragment w tekście.");return}
    if(sel.includes("[[")||sel.includes("]]")){alert("Zaznaczenie zawiera już lukę.");return}
    const lead=sel.length-sel.trimStart().length,core=sel.trim();
    e.text=x.value.slice(0,s+lead)+"[["+core+"]]"+x.value.slice(s+lead+core.length);save();teacher()};
  $("#un").onclick=()=>{const m=[...e.text.matchAll(GAP)].pop();if(m){e.text=e.text.slice(0,m.index)+m[1].split("|")[0].trim()+e.text.slice(m.index+m[0].length);save();teacher()}};
  document.querySelectorAll("[data-g]").forEach(inp=>inp.onchange=()=>{const k=+inp.dataset.g;let i=0;
    e.text=e.text.replace(GAP,m=>i++===k?"[["+(inp.value.split("|").map(s=>s.trim()).filter(Boolean).join("|")||"?")+"]]":m);save();teacher()});
  $("#gen").onclick=()=>{if(!gaps(e.text).length){alert("Dodaj przynajmniej jedną lukę.");return}
    const l=link(e);$("#lk").innerHTML=`<div class="hint" style="margin-top:14px"><b>Link dla ucznia:</b></div><textarea class="code" readonly onclick="this.select()">${esc(l)}</textarea><div class="row"><button class="btn g" id="cl">📋 Kopiuj link</button><span class="msg" id="lm"></span></div>`;
    $("#cl").onclick=()=>{const ta=$("#lk textarea");ta.select();try{navigator.clipboard.writeText(l)}catch(z){document.execCommand("copy")}$("#lm").textContent="Skopiowano!"}};
  $("#pv").onclick=()=>{if(!gaps(e.text).length){alert("Dodaj przynajmniej jedną lukę.");return}student({i:e.id,t:e.title,n:e.inst,x:e.text,b:e.bank,e:e.extra,im:e.images||[],p:1});
    app.insertAdjacentHTML("afterbegin",`<div class="row" style="margin:0 0 12px"><button class="btn p" id="bkp">← Wróć do edycji</button></div>`);$("#bkp").onclick=teacher}
  $("#del").onclick=()=>{if(confirm("Usunąć ten tekst wraz z wynikami?")){S.ex=S.ex.filter(z=>z.id!==e.id);S.res=S.res.filter(r=>r.ex!==e.id);curE=null;save();teacher()}};
}

/* ---------- START ---------- */
async function init(){
  const m=location.hash.match(/^#u=(.+)$/);
  if(m){try{student(dec(m[1]));return}catch(e){app.innerHTML=hdr("Ups","Ten link jest uszkodzony")+`<div class="card">Poproś nauczyciela o nowy link.</div>`;return}}
  let owner=true;
  try{const u=await claude.use("user");if(u)owner=await u.isOwner()}catch(e){}
  if(!owner){app.innerHTML=hdr("Ćwiczenia z lukami","Otwórz link otrzymany od nauczyciela")+`<div class="card">Ta strona to panel nauczyciela. Uczeń otwiera ćwiczenie przez swój link.</div>`;return}
  await load();teacher();
}
window.addEventListener("hashchange",()=>location.reload());
init();
})();
</script>
